{% if events %}
<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th scope="col">{{ t('col.id') }}</th>
      <th scope="col">{{ t('col.source') }}</th>
      <th scope="col" class="col-opt">{{ t('col.type') }}</th>
      <th scope="col">{{ t('col.time') }}</th>
    </tr>
  </thead>
  <tbody>
    {% for e in events %}
    <tr>
      <td class="mono"><a href="/ui/events/{{ e.id | urlencode }}" title="{{ e.id }}">{{ e.id | short_id }}</a></td>
      <td>{{ e.source }}</td>
      <td class="col-opt mono truncate" title="{{ e.type }}">{{ e.type }}</td>
      <td class="time">{{ e.time | when }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% else %}
<p class="empty">{{ t('empty.events') }}</p>
{% endif %}
