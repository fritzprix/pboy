<!DOCTYPE html>
<html lang="{{ html_lang }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Pageboy{% endblock %}</title>
  <link rel="stylesheet" href="/ui/static/dashboard.css" />
  <script src="/ui/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand-row">
      <div class="brand">
        <a href="/ui">Pageboy</a>
        <span class="tag">local</span>
      </div>
      <nav class="nav" aria-label="{{ t('nav.aria') }}">
        <a href="/ui" class="{% if page == 'overview' %}active{% endif %}">{{ t('nav.overview') }}</a>
        <a href="/ui/settings" class="{% if page == 'settings' %}active{% endif %}">{{ t('nav.settings') }}</a>
      </nav>
      <form class="lang-switch" method="get" action="/ui/lang">
        <input type="hidden" name="next" value="{{ current_path }}" />
        <label>
          <span class="visually-hidden">{{ t('lang.label') }}</span>
          <select name="lang" aria-label="{{ t('lang.label') }}" onchange="this.form.submit()">
            {% for code, name in languages %}
            <option value="{{ code }}" lang="{{ code }}"{% if code == lang %} selected{% endif %}>{{ name }}</option>
            {% endfor %}
          </select>
        </label>
        <noscript><button type="submit" class="btn">{{ t('lang.apply') }}</button></noscript>
      </form>
    </div>
    <p class="sub">{% block subtitle %}{{ t('base.subtitle') }}{% endblock %}</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
