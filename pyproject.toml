[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pboy"
description = "Pageboy: local-first Zero-Ops event orchestrator — Telegram/Slack wake-ups to topic hooks (exec), CloudEvents, loopback-only daemon + UI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "fritzprix" },
]
keywords = [
    "pageboy",
    "pboy",
    "telegram",
    "telegram-bot",
    "slack",
    "slack-bot",
    "socket-mode",
    "cloudevents",
    "event-orchestrator",
    "local-first",
    "zero-ops",
    "fastapi",
    "hooks",
    "agent",
    "mcp",
    "jira",
    "confluence",
]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "aiosqlite>=0.19,<1.0",
    "cryptography>=42.0,<44.0",
    "httpx>=0.27,<1.0",
    # Slack Socket Mode uses legacy asyncio connect kwargs (max_queue); 13+ drops them.
    "websockets>=12.0,<13.0",
    "python-dotenv>=1.0,<2.0",
    "loguru>=0.7,<1.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "telethon>=1.45.0,<2.0",
    "mcp>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
pboy = "pboy.cli.main:main"
pb = "pboy.cli.main:main"

[project.urls]
Homepage = "https://github.com/fritzprix/pboy"
Repository = "https://github.com/fritzprix/pboy"
Documentation = "https://github.com/fritzprix/pboy/blob/main/docs/operator.md"
Changelog = "https://github.com/fritzprix/pboy/blob/main/CHANGELOG.md"
Issues = "https://github.com/fritzprix/pboy/issues"
"Bug Tracker" = "https://github.com/fritzprix/pboy/issues"

[tool.hatch.version]
path = "src/pboy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pboy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "contract: public API / behavioral contract tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
