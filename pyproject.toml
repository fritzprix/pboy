[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pboy"
version = "0.1.0"
description = "Zero-Ops Agent Event Orchestrator & Dispatcher"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "fritzprix" },
]
keywords = ["agent", "event-bus", "cloud-events", "jira", "confluence", "telegram", "slack", "zero-ops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "typer[all]>=0.12,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "aiosqlite>=0.19,<1.0",
    "cryptography>=42.0,<44.0",
    "httpx>=0.27,<1.0",
    "websockets>=12.0,<13.0",
    "python-dotenv>=1.0,<2.0",
    "loguru>=0.7,<1.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
pboy = "pboy.cli.main:main"
pb = "pboy.cli.main:main"

[project.urls]
"Homepage" = "https://github.com/fritzprix/pboy"
"Repository" = "https://github.com/fritzprix/pboy"
"Bug Tracker" = "https://github.com/fritzprix/pboy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pboy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "contract: public API / behavioral contract tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
